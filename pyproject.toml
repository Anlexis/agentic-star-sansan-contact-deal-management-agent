[project]
name = "cmn-c2-274"
version = "0.1.0"
description = "SansanContactDealAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; CI
# installs it from an internal package index. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# The four below ARE real runtime deps: src/api/server.py imports fastapi +
# pydantic directly, src/graph/graph.py imports yaml directly (config
# loading), src/graph/domain_workflow_graph.py imports langgraph directly.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "fastapi==0.136.0",
    "pydantic==2.12.5",
    "langgraph==1.1.10",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Framework-wheel compatibility exception: the published agenticstar-agentcore
# wheel ships no py.typed marker, so framework.* / shared.* imports resolve to
# Any — which makes every required framework subclass an [import-untyped] /
# "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict with NotRequired fields —
# correct at runtime, but the untyped wheel makes AgentState `Any`, so mypy
# cannot see the TypedDict base and mis-flags every NotRequired field. Silence
# only that diagnostic, only for the state module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
