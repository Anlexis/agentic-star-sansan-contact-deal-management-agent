# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block.
id: "CMN-C2-274"
name: "SansanContactDealAgent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 2"
generation_mode: "llm"  # deterministic | llm — LLM enhances the deterministic
                        # baseline in classify_intent / infer_sansan_fields;
                        # any LLM failure degrades to that baseline (docs/02).
industry: "CMN"

base_type: "ToolCallingAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
class: "src.graph.graph.SansanContactDealAgent"

required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — declare every ctx.secrets.require() key + constructed extra.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI
